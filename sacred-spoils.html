<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SACRED SPOILS // GLITCHED RECORDS</title>
    <style>
        /* GLITCH AESTHETIC RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow-x: hidden;
        }

        /* PRODUCT CONTAINER */
        .product-container {
            position: relative;
            height: 100vh;
            width: 100%;
            display: flex;
            /* CHANGE: Push content to the bottom */
            align-items: flex-end; 
            justify-content: center;
            overflow: hidden;
            border-bottom: 2px solid #333;
            /* CHANGE: Add space at bottom so it's not on the floor */
            padding-bottom: 15vh; 
        }

        /* BACKGROUND VIDEO */
        .product-container video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            z-index: 1;
            opacity: 0.6;
            filter: contrast(1.2) brightness(0.8);
        }

        /* TEXT OVERLAY */
        .overlay {
            position: relative;
            z-index: 10;
            text-align: center;
            background: rgba(0, 0, 0, 0.7); /* Slightly darker for readability */
            padding: 1.5rem 3rem;
            border: 1px solid #fff;
            backdrop-filter: blur(5px);
            max-width: 90%;
            /* CHANGE: Add a subtle slide-up animation */
            animation: slideUp 1s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        h2 {
            font-size: 2.5rem; /* Slightly smaller to save space */
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 0px #ff00ff;
        }

        p {
            font-size: 1rem;
            margin-bottom: 1.5rem;
            color: #ccc;
        }

        /* THE ACQUIRE BUTTON */
        .btn {
            display: inline-block;
            padding: 15px 40px;
            background-color: transparent;
            color: #fff;
            border: 2px solid #fff;
            text-decoration: none;
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #fff;
            color: #000;
            box-shadow: 4px 4px 0px #00ffff;
        }

        /* MOBILE ADJUSTMENTS */
        @media (max-width: 768px) {
            h2 { font-size: 1.8rem; }
            .product-container { padding-bottom: 20vh; } /* Push higher on phone */
            .overlay { padding: 1rem 2rem; }
            .product-container video {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
        }
    </style>
</head>
<body>

    <div class="product-container">
        <video autoplay loop muted playsinline>
            <source src="Pony.mp4" type="video/mp4">
        </video>
        <div class="overlay">
            <h2>TRICK PONY</h2>
            <p>$35.00 // CROP TEE</p>
            <a href="https://www.paypal.com/ncp/payment/F3Z5SV3AF2RF2" class="btn">ACQUIRE</a>
        </div>
    </div>

    <div class="product-container">
        <video autoplay loop muted playsinline>
            <source src="Demented.mp4" type="video/mp4">
        </video>
        <div class="overlay">
            <h2>DEMENTED</h2>
            <p>$35.00 // CROP TEE</p>
            <a href="https://www.paypal.com/ncp/payment/VWKSXG8LP9H2G" class="btn">ACQUIRE</a>
        </div>
    </div>

    <div class="product-container">
        <video autoplay loop muted playsinline>
            <source src="Hoodie.mp4" type="video/mp4">
        </video>
        <div class="overlay">
            <h2>THE TROPHY HOE</h2>
            <p>$66.60 // OVERSIZED HOODIE</p>
            <a href="https://www.paypal.com/ncp/payment/XU4SCNF6S7ELS" class="btn">ACQUIRE</a>
        </div>
    </div>

</body>
</html>
