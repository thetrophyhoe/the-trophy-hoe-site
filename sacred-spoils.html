<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SACRED SPOILS // GLITCHED RECORDS</title>
    <style>
        /* GLITCH AESTHETIC RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow-x: hidden;
            width: 100%;
        }

        /* PRODUCT CONTAINER */
        .product-container {
            position: relative;
            width: 100%;
            height: 100vh; /* Keeps the full-screen scroll feel */
            display: flex;
            flex-direction: column;
            background: #000;
            border-bottom: 2px solid #333;
        }

        /* VIDEO WRAPPER - Prevents the zoom-cutoff */
        .video-wrap {
            flex: 1; /* Takes up all available space above the overlay */
            position: relative;
            width: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-wrap video {
            width: 100%;
            height: 100%;
            /* 'contain' ensures the whole video fits. 
               'cover' with specific object-position can work if you prefer the zoom. */
            object-fit: contain; 
            z-index: 1;
            opacity: 0.9; 
            filter: contrast(1.1) brightness(1.0);
        }

        /* THE BOTTOM CONTROL STRIP */
        .overlay {
            width: 100%;
            z-index: 10;
            text-align: center;
            background: #000; 
            padding: 2rem 0; /* More breathing room */
            border-top: 1px solid #fff;
        }

        h2 {
            font-size: 1.6rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 0.5rem;
            color: #fff;
            text-shadow: 0px 0px 8px #ff00ff;
        }

        p {
            font-size: 0.8rem;
            margin-bottom: 1.5rem;
            color: #ccc;
            letter-spacing: 2px;
        }

        /* THE ACQUIRE BUTTON */
        .btn {
            display: block;
            width: 85%;
            max-width: 350px;
            margin: 0 auto;
            padding: 15px 0;
            background-color: #000;
            color: #fff;
            border: 1px solid #fff;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 4px;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .btn:hover {
            background-color: #fff;
            color: #000;
            box-shadow: 0px 0px 20px #00ffff;
        }

        /* MOBILE FIXES */
        @media (max-width: 768px) {
            .product-container { height: 100dvh; }
            h2 { font-size: 1.4rem; }
            .video-wrap video {
                /* On mobile, we force 'cover' but shift the focus 
                   if the subjects are being cut off. */
                object-fit: cover;
                object-position: center; 
            }
        }
    </style>
</head>
<body>

    <div class="product-container">
        <div class="video-wrap">
            <video autoplay loop muted playsinline>
                <source src="Pony.mp4" type="video/mp4">
            </video>
        </div>
        <div class="overlay">
            <h2>TRICK PONY</h2>
            <p>$35.00 // CROP TEE</p>
            <a href="https://www.paypal.com/ncp/payment/F3Z5SV3AF2RF2" class="btn">ACQUIRE</a>
        </div>
    </div>

    <div class="product-container">
        <div class="video-wrap">
            <video autoplay loop muted playsinline>
                <source src="Demented.mp4" type="video/mp4">
            </video>
        </div>
        <div class="overlay">
            <h2>DEMENTED</h2>
            <p>$35.00 // CROP TEE</p>
            <a href="https://www.paypal.com/ncp/payment/VWKSXG8LP9H2G" class="btn">ACQUIRE</a>
        </div>
    </div>

    <div class="product-container">
        <div class="video-wrap">
            <video autoplay loop muted playsinline>
                <source src="Hoodie.mp4" type="video/mp4">
            </video>
        </div>
        <div class="overlay">
            <h2>THE TROPHY HOE</h2>
            <p>$66.60 // OVERSIZED HOODIE</p>
            <a href="https://www.paypal.com/ncp/payment/XU4SCNF6S7ELS" class="btn">ACQUIRE</a>
        </div>
    </div>

</body>
</html>
