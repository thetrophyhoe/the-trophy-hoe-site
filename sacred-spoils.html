<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SACRED SPOILS // GLITCHED RECORDS</title>
    <style>
        /* GLITCH AESTHETIC RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow-x: hidden;
        }

        /* PRODUCT CONTAINER */
        .product-container {
            position: relative;
            height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            overflow: hidden;
            border-bottom: 2px solid #333;
        }

        /* BACKGROUND VIDEO */
        .product-container video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            z-index: 1;
            /* Less fade so the shirt pops more */
            opacity: 0.8; 
            filter: contrast(1.1) brightness(0.9);
        }

        /* THE BOTTOM CONTROL STRIP (EDGE TO EDGE) */
        .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%; /* Full Width */
            z-index: 10;
            text-align: center;
            /* Solid Black background to act as the divide */
            background: #000; 
            padding: 1.5rem 0;
            border-top: 1px solid #fff;
            box-shadow: 0px -10px 30px rgba(0,0,0,1); /* Shadow blending upwards */
        }

        h2 {
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 0.2rem;
            color: #fff;
            text-shadow: 0px 0px 5px #ff00ff;
        }

        p {
            font-size: 0.9rem;
            margin-bottom: 1rem;
            color: #ccc;
            letter-spacing: 1px;
        }

        /* THE ACQUIRE BUTTON */
        .btn {
            display: block;
            width: 90%; /* Wide button for easy mobile tapping */
            max-width: 400px;
            margin: 0 auto; /* Center it */
            padding: 12px 0;
            background-color: #1a1a1a;
            color: #fff;
            border: 1px solid #fff;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 3px;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .btn:hover {
            background-color: #fff;
            color: #000;
            box-shadow: 0px 0px 15px #00ffff;
        }

        /* MOBILE ADJUSTMENTS */
        @media (max-width: 768px) {
            h2 { font-size: 1.5rem; }
            .btn { width: 85%; }
        }
    </style>
</head>
<body>

    <div class="product-container">
        <video autoplay loop muted playsinline>
            <source src="Pony.mp4" type="video/mp4">
        </video>
        <div class="overlay">
            <h2>TRICK PONY</h2>
            <p>$35.00 // CROP TEE</p>
            <a href="https://www.paypal.com/ncp/payment/F3Z5SV3AF2RF2" class="btn">ACQUIRE</a>
        </div>
    </div>

    <div class="product-container">
        <video autoplay loop muted playsinline>
            <source src="Demented.mp4" type="video/mp4">
        </video>
        <div class="overlay">
            <h2>DEMENTED</h2>
            <p>$35.00 // CROP TEE</p>
            <a href="https://www.paypal.com/ncp/payment/VWKSXG8LP9H2G" class="btn">ACQUIRE</a>
        </div>
    </div>

    <div class="product-container">
        <video autoplay loop muted playsinline>
            <source src="Hoodie.mp4" type="video/mp4">
        </video>
        <div class="overlay">
            <h2>THE TROPHY HOE</h2>
            <p>$66.60 // OVERSIZED HOODIE</p>
            <a href="https://www.paypal.com/ncp/payment/XU4SCNF6S7ELS" class="btn">ACQUIRE</a>
        </div>
    </div>

</body>
</html>
