<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE TROPHY HOE // TRANSACTIONAL // 03.13.26</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* --- CORE STRIKE --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #000; /* Deepest layer */
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            overflow-x: hidden;
            position: relative;
            animation: crt-flicker 0.15s infinite;
        }
        
        @keyframes crt-flicker { 0% { opacity: 0.98; } 50% { opacity: 1; } 100% { opacity: 0.99; } }

        /* --- ATMOSPHERE LAYERS --- */
        .scanlines {
            background: linear-gradient(to bottom, rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%);
            background-size: 100% 4px; position: fixed; pointer-events: none; 
            top: 0; right: 0; bottom: 0; left: 0; z-index: 5;
        }
        .scanline-roll {
            position: fixed; top: 0; left: 0; width: 100%; height: 100px;
            background: linear-gradient(to bottom, rgba(0,255,255,0), rgba(0,255,255,0.05), rgba(0,255,255,0));
            z-index: 6; pointer-events: none; opacity: 0.4; animation: roll-down 10s linear infinite;
        }
        @keyframes roll-down { 0% { top: -100px; } 100% { top: 100%; } }
        
        .grain {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 4; opacity: 0.12;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            animation: grain-shift 0.15s steps(4) infinite;
        }
        @keyframes grain-shift { 0% { transform: translate(0,0); } 50% { transform: translate(-2%,2%); } 100% { transform: translate(2%,-2%); } }

        .vignette {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 40%, rgba(0,0,0,0.8) 100%);
            z-index: 7; pointer-events: none;
        }

        /* --- THE VIDEO PROTOCOL --- */
        #bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: 1; /* Above the black void */
            transform: translate(-50%, -50%);
            opacity: 0.45;
            filter: contrast(1.1) brightness(0.5);
            object-fit: cover;
            pointer-events: none;
        }

        .container { max-width: 600px; margin: 0 auto; padding: 20px 20px; position: relative; z-index: 10; }

        /* --- UI ELEMENTS --- */
        .signature-logo { width: 100%; max-width: 350px; margin-bottom: 10px; filter: drop-shadow(0 0 10px rgba(0, 255, 255, 0.4)); cursor: pointer; }
        .hero-block { position: relative; margin-bottom: 30px; border: 1px solid #222; overflow: hidden; background: #000; }
        .hero-image { width: 100%; display: block; filter: brightness(0.8) contrast(1.1); }
        
        #countdown-timer {
            position: absolute; bottom: 15%; left: 0; width: 100%;
            font-size: clamp(2.5rem, 10vw, 4.5rem); color: #00ffff; font-weight: 900;
            letter-spacing: -2px; text-shadow: 0 0 20px rgba(0, 255, 255, 0.8), 2px 2px #ff00ff;
            font-family: 'Arial Black', sans-serif; pointer-events: none;
        }

        .subtitle { font-size: 0.9rem; color: #ff00ff; letter-spacing: 5px; margin-bottom: 20px; text-transform: uppercase; text-shadow: 0 0 8px #ff00ff; }
        .btn { display: block; width: 100%; margin-bottom: 15px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; border: 1px solid #444; background: rgba(0,0,0,0.9); color: #fff; text-decoration: none; }
        
        .purchase-link { border: 2px solid #00ffff; padding: 0; line-height: 0; box-shadow: 0 0 20px rgba(0, 255, 255, 0.3); }
        .purchase-link img { width: 100%; display: block; }

        .social-row { display: flex; justify-content: center; gap: 30px; margin-top: 30px; margin-bottom: 50px; }
        .social-icon { font-size: 2rem; color: #666; transition: 0.3s; }
        .social-icon:hover { color: #00ffff; text-shadow: 0 0 10px #00ffff; }

        /* --- BREACH OVERLAY --- */
        #breach-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: black; z-index: 99999; display: none;
            justify-content: center; align-items: center;
        }
        #breach-video { width: 100%; height: 100%; object-fit: contain; }
        .breach-active { display: flex !important; }
        .system-failure { animation: violent-shake 0.1s infinite; filter: invert(1) hue-rotate(90deg); }
        @keyframes violent-shake { 0% { transform: translate(3px, 3px); } 50% { transform: translate(-3px, -3px); } 100% { transform: translate(0); } }
    </style>
</head>
<body>

    <div class="vignette"></div>
    <div class="scanlines"></div>
    <div class="scanline-roll"></div>
    <div class="grain"></div>

    <div id="breach-overlay">
        <video id="breach-video" playsinline>
            <source src="breach_cinematic.mp4" type="video/mp4">
        </video>
    </div>

    <video autoplay loop muted playsinline id="bg-video">
        <source src="teraback.mp4" type="video/mp4">
    </video>

    <div class="container">
        <img src="logo.png" alt="THE TROPHY HOE" class="signature-logo" id="main-logo">
        <div class="hero-block">
            <img src="transactional_date.png" alt="03.13.26" class="hero-image">
            <div id="countdown-timer">00:00:00:00</div>
        </div>
        <div class="subtitle">TRANSACTIONAL // ERA_02</div>
        <a href="https://payhip.com/b/4TUNw" class="btn purchase-link">
            <img src="kys.png" alt="KEEP YOUR SOVEREIGNTY">
        </a>
        <a href="/sacred-spoils" class="btn" style="border-color: #ff00ff; color: #ff00ff; padding: 18px;">🛍️ SACRED SPOILS</a>
        <a href="https://glitchedrecords.com" class="btn" style="border-color: #e0e0e0; color: #e0e0e0; padding: 18px;">💿 GLITCHED RECORDS // HQ</a>

        <div class="social-row">
            <a href="https://instagram.com/thetrophyhoe" class="social-icon"><i class="fab fa-instagram"></i></a>
            <a href="https://tiktok.com/@thetrophyhoe" class="social-icon"><i class="fab fa-tiktok"></i></a>
            <a href="https://youtube.com/@trophyhoe" class="social-icon"><i class="fab fa-youtube"></i></a>
        </div>
        <div class="footer-text" style="font-size: 0.6rem; color: #444; text-transform: uppercase;">
            © 2026 GLITCHED RECORDS | Oceanside, CA
        </div>
    </div>

    <script>
        // COUNTDOWN
        const targetDate = new Date("March 13, 2026 00:00:00").getTime();
        setInterval(() => {
            const now = new Date().getTime();
            const d = Math.floor((targetDate - now) / (1000 * 60 * 60 * 24));
            const h = Math.floor(((targetDate - now) % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor(((targetDate - now) % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor(((targetDate - now) % (1000 * 60)) / 1000);
            document.getElementById('countdown-timer').innerHTML = `${d.toString().padStart(2,'0')}:${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        }, 1000);

        // THE FORCE PLAY TRIGGER
        const forceSignal = () => {
            const vid = document.getElementById('bg-video');
            vid.play().then(() => console.log("Transmission Active")).catch(err => console.error("Signal Blocked"));
        };
        document.body.addEventListener('click', forceSignal, {once: true});
        document.body.addEventListener('touchstart', forceSignal, {once: true});

        // BREACH
        document.getElementById('main-logo').addEventListener('dblclick', () => {
            document.body.classList.add('system-failure');
            document.getElementById('breach-overlay').classList.add('breach-active');
            document.getElementById('breach-video').play();
            document.getElementById('breach-video').onended = () => { window.location.href = "https://glitchedrecords.com"; };
        });
    </script>
</body>
</html>
