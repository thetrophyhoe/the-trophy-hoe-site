    <style>
        /* --- CORE --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #000;

            font-family: 'Courier New', Courier, monospace;
            text-align: center;

        /* --- THE BOOT OVERLAY (STRICT ENFORCEMENT) --- */
        #boot-screen {

            display: flex !important; /* FORCE DISPLAY */

        .boot-btn {
            border: 2px solid #00ffff; color: #00ffff; background: transparent;
            padding: 20px 40px; font-family: 'Courier New', monospace;
            font-size: 1.2rem; font-weight: bold; letter-spacing: 4px;
            cursor: pointer; text-transform: uppercase;
            box-shadow: 0 0 15px #00ffff;
            animation: pulse 2s infinite;
            transition: 0.3s;
        }
        .boot-btn:hover { background: #00ffff; color: #000; box-shadow: 0 0 30px #00ffff; }
        
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* --- THE VIDEO LAYER --- */
        #bg-video {
            position: fixed;
            top: 50%; left: 50%;
            min-width: 100vw; min-height: 100vh;
            width: auto; height: auto;
            z-index: 0; 
            transform: translate(-50%, -50%);
            object-fit: cover;
            opacity: 0.5; 
            filter: contrast(1.2) brightness(0.6);
        }

        /* --- ATMOSPHERE LAYERS --- */
        .scanlines {
            background: linear-gradient(to bottom, rgba(0,0,0,0) 50%, rgba(0,0,0,0.2) 50%);
            background-size: 100% 4px; position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
            z-index: 1; pointer-events: none;
        }
        .vignette {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 40%, rgba(0,0,0,1) 100%);
            z-index: 2; pointer-events: none;
        }

        /* --- CONTENT LAYER --- */
        .container { 
            max-width: 600px; margin: 0 auto; padding: 20px 20px; 
            position: relative; z-index: 10; 
            opacity: 0; transition: opacity 1s ease-in; /* Hidden until boot */
        }

        /* --- UI ELEMENTS --- */
        .signature-logo { 
            width: 100%; max-width: 350px; margin-bottom: 20px; 
            filter: drop-shadow(0 0 10px rgba(0,255,255,0.5)); 
            cursor: pointer; 
            transition: transform 0.1s;
        }
        .signature-logo:active { transform: scale(0.98); }
        
        .hero-block { 
            position: relative; margin-bottom: 30px; border: 1px solid #333; 
            background: #000; overflow: hidden;
        }
        .hero-image { width: 100%; display: block; opacity: 0.8; }
        
        #countdown-timer {
            position: absolute; bottom: 10%; left: 0; width: 100%;
            font-size: clamp(2rem, 8vw, 4rem); color: #00ffff; font-weight: 900;
            letter-spacing: -2px; text-shadow: 2px 2px 0px #ff00ff;
            font-family: 'Arial Black', sans-serif;
        }

        .subtitle { color: #ff00ff; letter-spacing: 5px; margin-bottom: 30px; font-weight: bold; text-shadow: 0 0 5px #ff00ff; }
        
        .section-title { 
            font-size: 0.7rem; letter-spacing: 3px; border-bottom: 1px solid #222; 
            margin: 40px 0 20px 0; padding-bottom: 5px; color: #444; text-transform: uppercase; 
        }

        .btn { 
            display: block; width: 100%; padding: 0; margin-bottom: 20px; 
            border: 1px solid #444; background: rgba(0,0,0,0.8); 
            text-decoration: none; color: #fff; font-weight: bold;
        }
        .purchase-link { border: 2px solid #00ffff; box-shadow: 0 0 15px rgba(0,255,255,0.2); }
        .purchase-link img { width: 100%; display: block; }
        
        .btn-spoils { padding: 20px; border-color: #ff00ff; color: #ff00ff; letter-spacing: 2px; }
        .btn-hq { padding: 20px; border-color: #fff; color: #fff; letter-spacing: 2px; }

        /* STANDARD 16:9 VIDEO WRAPPER */
        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; margin-bottom: 25px; border: 1px solid #222; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        /* VERTICAL VIDEO WRAPPER (9:16) FOR THE CRUCIFLEX */

        .social-row { display: flex; justify-content: center; gap: 30px; margin: 40px 0; }

        .footer-tags-block { color: #ff00ff; font-weight: 900; letter-spacing: 3px; font-size: 1.2rem; line-height: 1.5; margin-bottom: 20px; }
        .footer-text { font-size: 0.7rem; color: #555; text-transform: uppercase; }

        /* --- BREACH OVERLAY --- */
        #breach-overlay {

        .system-failure { animation: shake 0.1s infinite; filter: invert(1); }
        @keyframes shake { 0% { transform: translate(2px, 2px); } 100% { transform: translate(-2px, -2px); } }

    <script>
        // --- BOOT SEQUENCE LOGIC ---
        function initializeSystem() {
            const bootScreen = document.getElementById('boot-screen');
            const container = document.getElementById('main-content');
            const video = document.getElementById('bg-video');

            // 1. ATTEMPT PLAY (Authorized by Click)
            video.play().then(() => {
                console.log("Transmission Stabilized.");
            }).catch(error => {
                console.error("Video Failed:", error);
            });

            // 2. ANIMATE UNLOCK
            bootScreen.style.opacity = '0';
            setTimeout(() => {
                bootScreen.style.display = 'none';
                container.style.opacity = '1';
            }, 500);
        }

        // --- COUNTDOWN ---
        const targetDate = new Date("March 13, 2026 00:00:00").getTime();
        setInterval(() => {
            const now = new Date().getTime();
            const d = Math.floor((targetDate - now) / (1000 * 60 * 60 * 24));
            const h = Math.floor(((targetDate - now) % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor(((targetDate - now) % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor(((targetDate - now) % (1000 * 60)) / 1000);
            document.getElementById('countdown-timer').innerText = `${d.toString().padStart(2,'0')}:${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        }, 1000);

        // --- BREACH PROTOCOL (EASTER EGG) ---
        const logo = document.getElementById('main-logo');
        const triggerTag = document.getElementById('breach-trigger');
        const overlay = document.getElementById('breach-overlay');
        const breachVid = document.getElementById('breach-video');

        function executeBreach() {
            document.body.classList.add('system-failure');
            overlay.classList.add('breach-active');
            breachVid.play();
            
            // REDIRECT TO THEANTICHRIST.AI ON END
            breachVid.onended = () => { 
                window.location.href = "https://theantichrist.ai"; 
            };
        }

        // TRIGGER 1: DOUBLE CLICK LOGO
        logo.addEventListener('dblclick', executeBreach);

        // TRIGGER 2: TRIPLE CLICK FOOTER
        let clicks = 0;
        triggerTag.addEventListener('click', () => {
            clicks++;
            if(clicks === 3) executeBreach();
        });
    </script>
