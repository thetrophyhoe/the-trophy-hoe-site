        /* --- THE LOGO (GLITCHED) --- */
        .logo-container {

            max-width: 80vw;

            animation: logo-flicker 3s infinite;
        }

        @keyframes logo-flicker {
            0% { opacity: 1; filter: drop-shadow(0 0 5px #ff0055); }
            5% { opacity: 0.8; filter: drop-shadow(0 0 2px #ff0055) hue-rotate(90deg); }
            10% { opacity: 1; filter: drop-shadow(0 0 5px #ff0055); }

        /* --- TEXT GLITCH EFFECTS --- */
        .glitch-text {
            font-size: 14px;
            letter-spacing: 3px;
            color: #ff0055; /* Glitch Pink */
            position: relative;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .glitch-text::before, .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }

        .glitch-text::before {
            left: 2px;
            text-shadow: -1px 0 #00e5ff;
            clip: rect(24px, 550px, 90px, 0);
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }

        .glitch-text::after {
            left: -2px;
            text-shadow: -1px 0 #ff0055;
            clip: rect(85px, 550px, 140px, 0);
            animation: glitch-anim 2.5s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(11px, 9999px, 88px, 0); }
            20% { clip: rect(89px, 9999px, 11px, 0); }
            40% { clip: rect(5px, 9999px, 58px, 0); }
            60% { clip: rect(77px, 9999px, 15px, 0); }
            80% { clip: rect(23px, 9999px, 99px, 0); }
            100% { clip: rect(66px, 9999px, 33px, 0); }
        }
        @keyframes glitch-anim-2 {
            0% { clip: rect(65px, 9999px, 100px, 0); }
            20% { clip: rect(5px, 9999px, 22px, 0); }
            40% { clip: rect(98px, 9999px, 44px, 0); }
            60% { clip: rect(12px, 9999px, 67px, 0); }
            80% { clip: rect(44px, 9999px, 5px, 0); }
            100% { clip: rect(33px, 9999px, 88px, 0); }
        }
