        /* --- TRANSACTIONAL AESTHETICS (CYAN/MAGENTA/INDUSTRIAL) --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #030303;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            overflow-x: hidden;
            position: relative;
            animation: crt-flicker 0.15s infinite;

        @keyframes crt-flicker {
            0% { opacity: 0.98; } 50% { opacity: 1; } 100% { opacity: 0.99; }
        }

        /* --- ATMOSPHERE (CLINICAL GLITCH) --- */
        .scanlines {
            background: linear-gradient(to bottom, rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%);
            background-size: 100% 4px; position: fixed; pointer-events: none; top: 0; right: 0; bottom: 0; left: 0; z-index: 5;
        }
        .scanline-roll {
            position: fixed; top: 0; left: 0; width: 100%; height: 100px;
            background: linear-gradient(to bottom, rgba(0,255,255,0), rgba(0,255,255,0.05), rgba(0,255,255,0));
            z-index: 6; pointer-events: none; opacity: 0.4; animation: roll-down 10s linear infinite;
        }
        @keyframes roll-down { 0% { top: -100px; } 100% { top: 100%; } }
        
        .grain {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 4; opacity: 0.12;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            animation: grain-shift 0.15s steps(4) infinite;
        }
        @keyframes grain-shift {
            0% { transform: translate(0,0); } 50% { transform: translate(-2%,2%); } 100% { transform: translate(2%,-2%); }
        }
        .vignette {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 40%, rgba(0,0,0,0.8) 100%);

        .glitch-pixel {
            position: fixed; width: 4px; height: 4px; background: #00ffff; z-index: 8; pointer-events: none;
            box-shadow: 0 0 8px #ff00ff; opacity: 0; animation: pixel-flicker 0.2s linear;
        }
        @keyframes pixel-flicker { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(3); } }

        #bg-video {
            position: fixed; top: 50%; left: 50%; min-width: 100%; min-height: 100%; width: auto; height: auto; transform: translate(-50%, -50%);

        /* --- LOGO --- */

        }
        .signature-logo:hover { animation: glitch-skew 0.2s infinite; }
        
        @keyframes glitch-skew {
            0% { transform: translate(0); filter: drop-shadow(2px 0 #ff00ff); }
            50% { transform: translate(-2px, 2px); filter: drop-shadow(-2px 0 #00ffff); }
            100% { transform: translate(0); }
        }

        /* --- HERO: TRANSACTIONAL DATE & COUNTDOWN --- */
        .hero-block { position: relative; margin-bottom: 30px; border: 1px solid #222; overflow: hidden; }
        .hero-image { width: 100%; display: block; filter: brightness(0.7) contrast(1.1); }
        
        #countdown-timer {
            position: absolute; bottom: 15%; left: 0; width: 100%;
            font-size: clamp(2.5rem, 10vw, 4.5rem); color: #00ffff; font-weight: 900;
            letter-spacing: -2px; text-shadow: 0 0 20px rgba(0, 255, 255, 0.8), 2px 2px #ff00ff;
            font-family: 'Arial Black', sans-serif;
            pointer-events: none;
        }

        .subtitle { font-size: 0.9rem; color: #ff00ff; letter-spacing: 5px; margin-bottom: 20px; text-transform: uppercase; text-shadow: 0 0 8px #ff00ff; }
        .section-title { font-size: 0.7rem; letter-spacing: 3px; border-bottom: 1px solid #222; margin: 40px 0 20px 0; padding-bottom: 5px; color: #444; text-transform: uppercase; }

        /* --- BUTTONS --- */
        .btn { display: block; width: 100%; margin-bottom: 15px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; border: 1px solid #444; background: rgba(0,0,0,0.9); color: #fff; transition: 0.2s; position: relative; overflow: hidden; text-decoration: none; }
        .btn:hover { transform: translateY(-2px); border-color: #fff; }
        
        /* PURCHASE STRIKE: KYS IMAGE */

        }
        .purchase-link img { width: 100%; display: block; transition: 0.3s; }
        .purchase-link:hover { border-color: #ff00ff; box-shadow: 0 0 40px #ff00ff; }
        .purchase-link:hover img { filter: hue-rotate(45deg) brightness(1.2); }

        @keyframes cyan-flicker {

        .btn-spoils { border: 1px solid #ff00ff; color: #ff00ff; padding: 18px; }

        .btn-label { border: 1px solid #e0e0e0; color: #e0e0e0; padding: 18px; }

        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; margin-bottom: 25px; border: 1px solid #111; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        .social-row { display: flex; justify-content: center; gap: 30px; margin-top: 30px; margin-bottom: 50px; }
        .social-icon { font-size: 2rem; color: #666; transition: 0.3s; }
        .social-icon:hover { color: #00ffff; text-shadow: 0 0 10px #00ffff; }

        .footer-tags-block {

        /* --- BREACH OVERLAY --- */

    <script>
        // --- COUNTDOWN TO 03.13.2026 ---
        const targetDate = new Date("March 13, 2026 00:00:00").getTime();
        const timerDisplay = document.getElementById('countdown-timer');

        setInterval(() => {
            const now = new Date().getTime();
            const distance = targetDate - now;
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);
            
            // Format with leading zeros
            const d = days.toString().padStart(2, '0');
            const h = hours.toString().padStart(2, '0');
            const m = minutes.toString().padStart(2, '0');
            const s = seconds.toString().padStart(2, '0');
            
            timerDisplay.innerHTML = `${d}:${h}:${m}:${s}`;
        }, 1000);

        // --- ROGUE PIXELS ---
        function spawnPixel() {
            const pixel = document.createElement('div');
            pixel.className = 'glitch-pixel';
            pixel.style.left = Math.random() * 100 + 'vw';
            pixel.style.top = Math.random() * 100 + 'vh';
            document.body.appendChild(pixel);
            setTimeout(() => pixel.remove(), 200);
        }
        setInterval(spawnPixel, 300);

        // --- EASTER EGGS ---
        const logo = document.getElementById('main-logo');
        const triggerTag = document.getElementById('breach-trigger');
        const overlay = document.getElementById('breach-overlay');
        const breachVid = document.getElementById('breach-video');
        
        logo.addEventListener('dblclick', () => executeBreach());
        let clicks = 0;
        triggerTag.addEventListener('click', () => {
            clicks++;
            if(clicks === 3) executeBreach();
        });

        function executeBreach() {
            document.body.classList.add('system-failure');
            overlay.classList.add('breach-active');
            breachVid.play();
            breachVid.onended = () => { window.location.href = "https://glitchedrecords.com"; };
        }
    </script>
