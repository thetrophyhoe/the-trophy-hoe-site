<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE TROPHY HOE | THE EXIT ACRONYM</title>
    <style>
        :root {
            --glitch-red: #ff003c;
            --glitch-blue: #00f0ff;
            --bg-color: #050505;
            --text-color: #ffffff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Glitch Text Effect */
        h1 {
            font-size: 2.5rem;
            text-transform: uppercase;
            position: relative;
            text-shadow: 2px 2px var(--glitch-red), -2px -2px var(--glitch-blue);
            animation: glitch 1s infinite alternate;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        @keyframes glitch {
            0% { text-shadow: 2px 2px var(--glitch-red), -2px -2px var(--glitch-blue); }
            25% { text-shadow: -2px 2px var(--glitch-blue), 2px -2px var(--glitch-red); }
            50% { text-shadow: 2px -2px var(--glitch-red), -2px 2px var(--glitch-blue); }
            75% { text-shadow: -2px -2px var(--glitch-blue), 2px 2px var(--glitch-red); }
            100% { text-shadow: 2px 2px var(--glitch-red), -2px -2px var(--glitch-blue); }
        }

        h2 {
            font-size: 1rem;
            color: #888;
            letter-spacing: 2px;
            margin-top: 0;
            margin-bottom: 2rem;
            text-align: center;
        }

        /* Responsive Video Container */
        .video-container {
            position: relative;
            width: 90%;
            max-width: 800px;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            border: 2px solid #333;
            box-shadow: 0 0 20px rgba(255, 0, 60, 0.2);
            margin-bottom: 2rem;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Buttons */
        .btn-container {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            background: transparent;
            color: var(--text-color);
            border: 1px solid var(--text-color);
            padding: 1rem 2rem;
            font-size: 1rem;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn:hover {
            background: var(--text-color);
            color: var(--bg-color);
            box-shadow: 0 0 10px var(--text-color);
        }

        .btn-primary {
            border-color: var(--glitch-red);
            color: var(--glitch-red);
        }

        .btn-primary:hover {
            background: var(--glitch-red);
            color: #fff;
            box-shadow: 0 0 15px var(--glitch-red);
        }

        footer {
            margin-top: 3rem;
            font-size: 0.8rem;
            color: #444;
            text-align: center;
            padding-bottom: 1rem;
        }
    </style>
</head>
<body>

    <h1>THE EXIT ACRONYM</h1>
    <h2>STARRING: THE TROPHY HOE && PLASTIC PISTOLZ</h2>

    <div class="video-container">
        <iframe 
            src="https://www.youtube.com/embed/CTg8NdRTyAE?autoplay=1&mute=1" 
            title="The Trophy Hoe - The Exit Acronym" 
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            allowfullscreen>
        </iframe>
    </div>

    <div class="btn-container">
        <a href="https://thetrophyhoe.com" class="btn btn-primary">BUY THE EP</a>
        <a href="https://open.spotify.com/artist/0Wt716RDrIkaGfNlSN8IFj?si=23GvfPcXTfOLJEXOoCZQaQ" class="btn">STREAM NOW</a>
    </div>

    <footer>
        &copy; 2026 GLITCHED RECORDS. ALL RIGHTS RESERVED.<br>
        SYSTEM STATUS: UNBOTHERED.
    </footer>

</body>
</html>
