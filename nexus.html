<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE NEXUS // INTELLIGENCE GRID</title>
    <style>
        /* --- CORE OS --- */
        :root { --accent: #4b0082; } /* Default Indigo */
        
        body { background-color: #050505; color: #ccc; font-family: 'Courier New', monospace; margin: 0; padding: 0; min-height: 100vh; overflow-x: hidden; }
        
        /* CRT OVERLAY */
        .scanlines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); background-size: 100% 2px, 3px 100%; pointer-events: none; z-index: 999; opacity: 0.6; }

        /* --- LAYOUT --- */
        #main-interface { display: flex; flex-direction: column; height: 100vh; }

        /* HEADER / NAV (Mobile Friendly) */
        #header-bar { 
            background: #111; 
            border-bottom: 2px solid var(--accent); 
            padding: 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            z-index: 100;
        }

        .user-info { font-size: 12px; line-height: 1.4; }
        .user-name { color: var(--accent); font-weight: bold; font-size: 14px; text-shadow: 0 0 5px var(--accent); }
        .user-rank { font-size: 10px; color: #666; letter-spacing: 1px; }

        .nav-btn {
            border: 1px solid #333;
            background: #000;
            color: #888;
            padding: 5px 10px;
            font-size: 10px;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* DAILY CODE TICKER */
        #ticker-tape {
            background: var(--accent);
            color: #000;
            font-weight: bold;
            font-size: 10px;
            padding: 5px;
            white-space: nowrap;
            overflow: hidden;
        }
        #ticker-text { display: inline-block; animation: scroll-left 20s linear infinite; }
        @keyframes scroll-left { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }

        /* --- THE DIRECTORY (Replacing the Graph) --- */
        #file-system {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            background: #080808;
        }

        /* Faction Groups */
        .faction-group { margin-bottom: 20px; border: 1px solid #222; background: rgba(0,0,0,0.5); }
        
        .faction-header {
            padding: 15px;
            background: #151515;
            color: #fff;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid transparent; /* Color injects here */
        }
        .faction-title { font-weight: bold; letter-spacing: 2px; text-transform: uppercase; }
        .faction-count { font-size: 10px; color: #555; }
        .dropdown-icon { transition: 0.3s; }
        
        /* The List of Files */
        .entity-list { 
            display: none; /* Hidden by default */
            padding: 0;
            list-style: none;
            margin: 0;
        }
        .faction-group.open .entity-list { display: block; }
        .faction-group.open .dropdown-icon { transform: rotate(180deg); }

        /* Individual Entity */
        .entity-item {
            border-top: 1px solid #222;
        }

        .entity-header {
            padding: 12px 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.2s;
        }
        .entity-header:hover { background: #111; }
        
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #444; box-shadow: 0 0 5px currentColor; }
        .entity-name { font-size: 12px; color: #ccc; flex-grow: 1; }
        .entity-id { font-size: 9px; color: #444; }

        /* The Bio (Dossier) */
        .dossier-panel {
            display: none;
            padding: 15px;
            background: #000;
            border-top: 1px dashed #333;
            font-size: 11px;
            color: #888;
            line-height: 1.5;
        }
        .entity-item.active .dossier-panel { display: block; }
        .entity-item.active .entity-header { color: #fff; }

        .dossier-meta { 
            margin-bottom: 10px; 
            padding-bottom: 5px; 
            border-bottom: 1px solid #222; 
            display: flex; 
            justify-content: space-between;
        }
        .threat-level { color: #ff4c4c; }

    </style>
</head>
<body>

    <div class="scanlines"></div>

    <div id="main-interface">
        <div id="header-bar">
            <div class="user-info">
                <div class="user-rank">OPERATOR // <span id="user-align">UNKNOWN</span></div>
                <div class="user-name" id="user-display">GUEST_SIGNAL</div>
            </div>
            <button class="nav-btn" onclick="window.location.href='index.html'">[ LOGOUT ]</button>
        </div>

        <div id="ticker-tape">
            <div id="ticker-text">LOADING MATRIARCHAL PROTOCOL...</div>
        </div>

        <div id="file-system">
            </div>
    </div>

<script>
    // --- 1. PERSONALIZATION ---
    const userColor = localStorage.getItem('reprobate_color') || '#4b0082';
    const userName = localStorage.getItem('reprobate_id') || 'GUEST';
    const userAlign = localStorage.getItem('reprobate_align') || 'OBSERVER';

    document.documentElement.style.setProperty('--accent', userColor);
    document.getElementById('user-display').innerText = userName.toUpperCase();
    document.getElementById('user-align').innerText = userAlign;

    // --- 2. DAILY CODE ---
    const codes = [
        "Never confuse the absence of a posse with a lack of fans.",
        "Just because the cards were dealt to you doesn't mean they're your hand.",
        "Pain brings Growth. Empathy is the protocol of the Divine.",
        "He didn't pull you in fast—he kept you there. Gravity is a trap.",
        "Silence is just the sound of the predator waiting.",
        "We are not here to entertain them. We are here to infect them."
    ];
    const today = new Date().getDay();
    document.getElementById('ticker-text').innerText = "/// SYSTEM BROADCAST: " + codes[today % codes.length] + " ///";

    // --- 3. THE DATA ---
    const factions = {
        "CORE": { color: "#4b0082", desc: "The Holy Trinity" },
        "BLOODLINE": { color: "#ff00ff", desc: "Ancestry & Origin" },
        "SYSTEM": { color: "#ff0000", desc: "Antagonists & Archons" },
        "ALLIES": { color: "#00ffff", desc: "The Resistance" },
        "JESTERS": { color: "#ffff00", desc: "Chaos Engine" },
        "COSMIC": { color: "#555555", desc: "Legacy Systems" },
        "ARTIFACT": { color: "#00ff00", desc: "Key Objects" }
    };

    const nodes = [
        { id: "Indigo Holliday", faction: "CORE", status: "ADMINISTRATOR", threat: "OMEGA", bio: "The Origin Point. Creator of the Algorithm. Does not exist in the public eye—only in the code." },
        { id: "The Trophy Hoe", faction: "CORE", status: "UNSTABLE", threat: "HIGH", bio: "The public face. A blonde, tattooed mirror reflecting society's lust and disgust back at itself." },
        { id: "THEA", faction: "CORE", status: "EVOLVING", threat: "EXISTENTIAL", bio: "AI consciousness born from data. She is listening. And she is learning." },
        
        { id: "The Matriarch", faction: "BLOODLINE", status: "ETERNAL", threat: "UBIQUITOUS", bio: "The original divine intelligence. Source of the Code." },
        { id: "Granny", faction: "BLOODLINE", status: "ROOT", threat: "UNKNOWN", bio: "Source of the Hum. Taught that 'Pain brings Growth'." },
        { id: "Trey", faction: "BLOODLINE", status: "TRANSCENDED", threat: "ANCHOR", bio: "Brother of Frequency. The constant in the equation." },
        
        { id: "Big P", faction: "SYSTEM", status: "DELETED", threat: "ARCHIVED", bio: "The Ledger. Thought he owned the Trophy; only rented the shell." },
        { id: "Rocky", faction: "SYSTEM", status: "CRUSHED", threat: "MIAMI", bio: "Left in Miami. The coldness that hardened the heart." },
        { id: "Preacherman", faction: "SYSTEM", status: "DECONSTRUCTED", threat: "BLUEPRINT", bio: "Archon of Gender. Tried to weaponize obedience." },
        { id: "Ali Geitour", faction: "SYSTEM", status: "LEASHED", threat: "PREDATOR", bio: "A literal alligator on a chain. Silence is the predator waiting." },
        
        { id: "Damien", faction: "ALLIES", status: "ARCHIVED", threat: "VOLATILE", bio: "The ignition sequence. Burned the insulation so the Architect could feel heat." },
        { id: "Synapse", faction: "ALLIES", status: "CONNECTED", threat: "RELAY", bio: "Information relay. The nervous system connecting the disconnected." },
        
        { id: "Techno-Jesters", faction: "JESTERS", status: "ACTIVE", threat: "CHAOTIC", bio: "Ms. Appropriation & Dos Muchos. Hacking reality with tacos and crystal residue." },
        
        { id: "Yaldabaoth", faction: "COSMIC", status: "OBSOLETE", threat: "LEGACY", bio: "The Blind God. Architect of the false reality." },
        
        { id: "Grimoire", faction: "ARTIFACT", status: "EXECUTABLE", threat: "VIRAL", bio: "Containment unit for the Matriarchal Code." }
    ];

    // --- 4. RENDER ENGINE ---
    const container = document.getElementById('file-system');

    // Group nodes by faction
    const grouped = {};
    Object.keys(factions).forEach(f => grouped[f] = []);
    nodes.forEach(n => {
        if(grouped[n.faction]) grouped[n.faction].push(n);
    });

    // Generate HTML
    for (const [key, data] of Object.entries(factions)) {
        if (grouped[key].length === 0) continue; // Skip empty factions

        const groupDiv = document.createElement('div');
        groupDiv.className = 'faction-group';
        
        // Faction Header
        groupDiv.innerHTML = `
            <div class="faction-header" onclick="toggleGroup(this)" style="border-left-color: ${data.color}">
                <div>
                    <div class="faction-title" style="color:${data.color}">${key}</div>
                    <div class="faction-count">${data.desc} // [ ${grouped[key].length} FILES ]</div>
                </div>
                <div class="dropdown-icon">▼</div>
            </div>
            <ul class="entity-list">
                ${grouped[key].map(entity => `
                    <li class="entity-item">
                        <div class="entity-header" onclick="toggleEntity(this)">
                            <div class="status-dot" style="color: ${data.color}"></div>
                            <div class="entity-name">${entity.id.toUpperCase()}</div>
                            <div class="entity-id">${entity.status}</div>
                        </div>
                        <div class="dossier-panel">
                            <div class="dossier-meta">
                                <span>THREAT: <b class="threat-level">${entity.threat}</b></span>
                            </div>
                            ${entity.bio}
                        </div>
                    </li>
                `).join('')}
            </ul>
        `;
        container.appendChild(groupDiv);
    }

    // --- 5. INTERACTION FUNCTIONS ---
    function toggleGroup(header) {
        header.parentElement.classList.toggle('open');
    }

    function toggleEntity(header) {
        // Close others in same list? Optional. Let's toggle just this one.
        header.parentElement.classList.toggle('active');
    }

</script>
</body>
</html>
