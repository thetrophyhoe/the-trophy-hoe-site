<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGNAL RECEIVED | PROTOCOL VERIFIED</title>
    <style>
        body {
            background-color: #000;
            color: #0f0; /* Terminal Green */
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            text-transform: uppercase;
            border-bottom: 1px solid #0f0;
            padding-bottom: 10px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #0f0;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 40px;
            color: #fff;
        }

        .status {
            color: #d4af37; /* Gold */
            font-weight: bold;
            margin-bottom: 20px;
        }

        .btn {
            background: transparent;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 15px 30px;
            font-size: 1rem;
            text-transform: uppercase;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #0f0;
            color: #000;
            box-shadow: 0 0 20px #0f0;
        }
    </style>
</head>
<body>

    <div class="status">> TRANSACTION: VERIFIED</div>

    <h1>Signal Received</h1>

    <p>Your armor is being forged.<br>Dispatch imminent.</p>
    <p style="font-size: 0.8rem; color: #666;">Check your email for tracking coordinates.</p>

    <a href="/" class="btn">Return to Void</a>

</body>
</html>
